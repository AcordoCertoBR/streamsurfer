name: Test

on:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: Lint
      run: go vet ./...

    - name: Test
      run: go test -race ./...
